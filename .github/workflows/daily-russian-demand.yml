name: Daily Russian demand collection

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run collect:russia-demand
      - run: npm test
      - name: Commit updated demand feed
        run: |
          git config user.name "tender-start-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/russianDemandFeed.json
          git diff --cached --quiet || git commit -m "data: refresh russian demand feed"
          git push
