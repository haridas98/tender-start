server {
  listen 16108 default_server;
  listen [::]:16108 default_server;
  server_name _;

  root /srv/tender-start/dist;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
